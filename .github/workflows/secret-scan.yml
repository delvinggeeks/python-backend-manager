name: Secret scan

# Secret scanning, position 2 of 2 — the one that is NOT bypassable.
#
# The pre-commit hook (see template/.pre-commit-config.yaml) catches a secret before it becomes
# history, but `git commit --no-verify` walks straight past it. This job cannot be skipped, so it
# is the actual control; the hook is a convenience in front of it.
#
# On a PR it scans the DIFF (fast, and the only thing the author can still fix cheaply). Weekly it
# sweeps the FULL history, because a secret committed before this gate existed is still a live
# credential today and no diff scan will ever see it.

on:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # Monday 04:17 UTC — off the hour to avoid the scheduler stampede
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff:
    name: "secrets (PR diff)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0   # gitleaks needs both endpoints of the range

      - name: Scan the pull request's commits
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  history:
    name: "secrets (full history)"
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Sweep the entire history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
