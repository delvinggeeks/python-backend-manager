name: Template CI/CD

# CI:  every push/PR generates real projects from this template across a matrix
#      and runs uv lock + ruff + pytest on each — proving the template still
#      produces a working project.
# CD:  on push to main, AFTER CI passes, auto-tag a version and cut a GitHub
#      Release so downstream `copier update` has a new version to pull.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write   # release job tags + creates releases

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-test:
    name: "generate (agent=${{ matrix.agent_framework }}, db=${{ matrix.include_db }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { agent_framework: none,          include_db: "true"  }
          - { agent_framework: pydantic-ai,   include_db: "true"  }
          - { agent_framework: langgraph,     include_db: "false" }
          - { agent_framework: openai-agents, include_db: "false" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # copier reads git history/refs

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.11.x"

      - name: Generate a project from the current commit
        run: |
          uvx copier copy --defaults --trust --vcs-ref HEAD \
            --data agent_framework=${{ matrix.agent_framework }} \
            --data include_db=${{ matrix.include_db }} \
            . /tmp/generated

      - name: Render-gate the generated GitHub workflows
        # Makes "green" real for the template BODY. These matrix legs are the repo's
        # REQUIRED checks, so embedding the parse here means a Renovate bump to an action
        # (checkout / setup-uv / create-pull-request / action-gh-release) inside
        # template/.github/workflows/ cannot go green unless it actually renders into
        # structurally-valid workflow YAML — which is what makes auto-merging action
        # majors safe. A pure copier render + Python lint/test would never load these files.
        working-directory: /tmp/generated
        run: |
          set -euo pipefail
          uv run --no-project --with pyyaml -- python - <<'PY'
          import glob
          import sys

          import yaml

          files = sorted(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml"))
          if not files:
              sys.exit("FAIL: no .github/workflows/* rendered into the generated service")
          for path in files:
              try:
                  with open(path) as fh:
                      doc = yaml.safe_load(fh)
              except yaml.YAMLError as exc:
                  sys.exit(f"FAIL: {path}: invalid YAML: {exc}")
              if not isinstance(doc, dict):
                  sys.exit(f"FAIL: {path}: not a YAML mapping")
              jobs = doc.get("jobs")
              if not isinstance(jobs, dict) or not jobs:
                  sys.exit(f"FAIL: {path}: missing or empty 'jobs' block")
              for name, job in jobs.items():
                  steps = job.get("steps")
                  if steps is not None and not isinstance(steps, list):
                      sys.exit(f"FAIL: {path}: job '{name}' has a malformed 'steps' list")
              print(f"ok: {path} ({len(jobs)} job(s))")
          print(f"render-gate parsed {len(files)} rendered workflow file(s)")
          PY

      - name: Lock, sync, lint, test the generated project
        working-directory: /tmp/generated
        run: |
          set -euo pipefail
          extras=""
          [ "${{ matrix.include_db }}" = "true" ] && extras="$extras --extra db"
          if [ "${{ matrix.agent_framework }}" != "none" ]; then
            extras="$extras --extra llm --extra ${{ matrix.agent_framework }}"
          fi
          echo "extras:$extras"
          git init -q && git add -A
          git -c user.email=ci@local -c user.name=ci commit -qm "ci: generated"
          uv lock
          uv sync $extras
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest

  generate-users:
    name: "generate (users + db)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # copier reads git history/refs

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.11.x"

      - name: Generate a users/auth project from the current commit
        run: |
          uvx copier copy --defaults --trust --vcs-ref HEAD \
            --data agent_framework=none \
            --data include_db=true \
            --data include_users=true \
            . /tmp/generated

      - name: Lock, sync, lint, test the generated project
        working-directory: /tmp/generated
        run: |
          set -euo pipefail
          git init -q && git add -A
          git -c user.email=ci@local -c user.name=ci commit -qm "ci: generated"
          uv lock
          uv sync --extra db --extra users
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest

  generate-tenancy:
    name: "generate (tenancy + db + users)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # copier reads git history/refs

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.11.x"

      - name: Generate a multi-tenancy project from the current commit
        run: |
          uvx copier copy --defaults --trust --vcs-ref HEAD \
            --data agent_framework=none \
            --data include_tenancy=true \
            . /tmp/generated

      - name: Lock, sync, lint, test the generated project
        working-directory: /tmp/generated
        run: |
          set -euo pipefail
          git init -q && git add -A
          git -c user.email=ci@local -c user.name=ci commit -qm "ci: generated"
          uv lock
          uv sync --extra db --extra users
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest

  generate-rbac:
    name: "generate (rbac + tenancy + db + users)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # copier reads git history/refs

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.11.x"

      - name: Generate an RBAC project from the current commit
        run: |
          uvx copier copy --defaults --trust --vcs-ref HEAD \
            --data agent_framework=none \
            --data include_rbac=true \
            . /tmp/generated

      - name: Lock, sync, lint, test the generated project
        working-directory: /tmp/generated
        run: |
          set -euo pipefail
          git init -q && git add -A
          git -c user.email=ci@local -c user.name=ci commit -qm "ci: generated"
          uv lock
          uv sync --extra db --extra users
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest

  generate-api-keys:
    name: "generate (api-keys + tenancy + db + users)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # copier reads git history/refs

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.11.x"

      - name: Generate an API-keys project from the current commit
        run: |
          uvx copier copy --defaults --trust --vcs-ref HEAD \
            --data agent_framework=none \
            --data include_api_keys=true \
            . /tmp/generated

      - name: Lock, sync, lint, test the generated project
        working-directory: /tmp/generated
        run: |
          set -euo pipefail
          git init -q && git add -A
          git -c user.email=ci@local -c user.name=ci commit -qm "ci: generated"
          uv lock
          uv sync --extra db --extra users
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest

  release:
    name: Tag + release
    needs: [generate-and-test, generate-users, generate-tenancy, generate-rbac, generate-api-keys]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version from Conventional Commits
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # only cut a release when a feat:/fix:/BREAKING commit exists since the
          # last tag; chore:/ci:/docs: pushes mint nothing (no version inflation).
          default_bump: false

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          generate_release_notes: true
          body: ${{ steps.tag.outputs.changelog }}
