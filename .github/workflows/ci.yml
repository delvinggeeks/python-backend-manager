name: Template CI/CD

# CI:  every push/PR generates real projects from this template across a matrix
#      and runs uv lock + ruff + pytest on each — proving the template still
#      produces a working project.
# CD:  on push to main, AFTER CI passes, auto-tag a version and cut a GitHub
#      Release so downstream `copier update` has a new version to pull.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write   # release job tags + creates releases

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-test:
    name: "generate (agent=${{ matrix.agent_framework }}, db=${{ matrix.include_db }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { agent_framework: none,          include_db: "true"  }
          - { agent_framework: pydantic-ai,   include_db: "true"  }
          - { agent_framework: langgraph,     include_db: "false" }
          - { agent_framework: openai-agents, include_db: "false" }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0   # copier reads git history/refs

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.11.x"

      - name: Generate a project from the current commit
        run: |
          uvx copier copy --defaults --trust --vcs-ref HEAD \
            --data agent_framework=${{ matrix.agent_framework }} \
            --data include_db=${{ matrix.include_db }} \
            . /tmp/generated

      - name: Render-gate the generated GitHub workflows
        # Makes "green" real for the template BODY. These matrix legs are the repo's
        # REQUIRED checks, so embedding the parse here means a Renovate bump to an action
        # (checkout / setup-uv / create-pull-request / action-gh-release) inside
        # template/.github/workflows/ cannot go green unless it actually renders into
        # structurally-valid workflow YAML — which is what makes auto-merging action
        # majors safe. A pure copier render + Python lint/test would never load these files.
        working-directory: /tmp/generated
        run: |
          set -euo pipefail
          uv run --no-project --with pyyaml -- python - <<'PY'
          import glob
          import sys

          import yaml

          files = sorted(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml"))
          if not files:
              sys.exit("FAIL: no .github/workflows/* rendered into the generated service")
          for path in files:
              try:
                  with open(path) as fh:
                      doc = yaml.safe_load(fh)
              except yaml.YAMLError as exc:
                  sys.exit(f"FAIL: {path}: invalid YAML: {exc}")
              if not isinstance(doc, dict):
                  sys.exit(f"FAIL: {path}: not a YAML mapping")
              jobs = doc.get("jobs")
              if not isinstance(jobs, dict) or not jobs:
                  sys.exit(f"FAIL: {path}: missing or empty 'jobs' block")
              for name, job in jobs.items():
                  steps = job.get("steps")
                  if steps is not None and not isinstance(steps, list):
                      sys.exit(f"FAIL: {path}: job '{name}' has a malformed 'steps' list")
              print(f"ok: {path} ({len(jobs)} job(s))")
          print(f"render-gate parsed {len(files)} rendered workflow file(s)")
          PY

      - name: Lock, sync, lint, test the generated project
        working-directory: /tmp/generated
        run: |
          set -euo pipefail
          extras=""
          [ "${{ matrix.include_db }}" = "true" ] && extras="$extras --extra db"
          if [ "${{ matrix.agent_framework }}" != "none" ]; then
            extras="$extras --extra llm --extra ${{ matrix.agent_framework }}"
          fi
          echo "extras:$extras"
          git init -q && git add -A
          git -c user.email=ci@local -c user.name=ci commit -qm "ci: generated"
          uv lock
          uv sync $extras
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run vulture src
          uv run xenon --max-absolute C --max-modules C --max-average B src
          uv run lint-imports
          uv run interrogate src
          uv run pytest

  generate-capability:
    name: "generate (${{ matrix.capability }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each capability implies db + users (billing additionally needs payments).
          # `data` is the copier toggle; `extras` the uv extras to sync. Add a row to
          # cover a future module and the "generate (capability)" gate below aggregates
          # it automatically — branch protection never has to change.
          - { capability: users,    data: "--data include_users=true",    extras: "--extra db --extra users" }
          - { capability: tenancy,  data: "--data include_tenancy=true",  extras: "--extra db --extra users" }
          - { capability: rbac,     data: "--data include_rbac=true",     extras: "--extra db --extra users" }
          - { capability: api_keys, data: "--data include_api_keys=true", extras: "--extra db --extra users" }
          - { capability: billing,  data: "--data include_billing=true",  extras: "--extra db --extra users --extra payments" }
          # Same billing module, but the OTHER provider — proves the Razorpay adapter + the
          # shared PaymentsPort contract test pass under payments_provider=razorpay too.
          - { capability: billing_razorpay, data: "--data include_billing=true --data payments_provider=razorpay", extras: "--extra db --extra users --extra payments" }
          # storage is db-independent; we exercise it WITH tenancy so the org-scoped,
          # tenant-prefixed path + membership dependency are covered and the alembic
          # round-trip below is meaningful. The plain-key path is unit-tested in-module.
          - { capability: storage,  data: "--data include_storage=true --data include_tenancy=true", extras: "--extra db --extra users --extra storage" }
          # Email is db-independent, but we exercise it WITH users so the welcome +
          # password-reset hooks in the user manager are wired and compiled and the alembic
          # round-trip below (over the users migration) is meaningful. Both adapters run: the
          # second row flips email_provider=ses, so the shared EmailPort contract test covers
          # SMTP *and* SES — exactly like billing + billing_razorpay (one matrix, not a leg).
          - { capability: email,     data: "--data include_email=true --data include_users=true", extras: "--extra db --extra users --extra email" }
          - { capability: email_ses, data: "--data include_email=true --data include_users=true --data email_provider=ses", extras: "--extra db --extra users --extra email" }
          # Background jobs (arq) is db-independent, but we pair the base row with db so the
          # unconditional alembic round-trip below still has a (trivially empty) chain to run.
          # The jobs_email row turns on email + users so the user-manager hooks ENQUEUE the
          # welcome / password-reset emails (instead of inline) and that wiring is compiled and
          # tested — both jobs configs run as matrix rows, not a separate leg.
          - { capability: jobs,       data: "--data include_jobs=true --data include_db=true", extras: "--extra db --extra worker" }
          - { capability: jobs_email, data: "--data include_jobs=true --data include_email=true --data include_users=true", extras: "--extra db --extra users --extra email --extra worker" }
          # Audit log is db-backed but users-independent: the base row runs it ALONE (no users, no
          # tenancy) so the flat /audit router, the None-rooted 0005 migration, and the DB-level
          # record() helper are all exercised — the alembic round-trip below covers 0005.
          - { capability: audit,    data: "--data include_audit=true", extras: "--extra db" }
          # Idempotency is db-backed and users-independent (on by default for any db service). This
          # ALONE row (bare db, no users/tenancy) exercises the IdempotencyMiddleware + store and the
          # None-rooted 0010 migration; the alembic round-trip below covers 0010 as the chain root.
          - { capability: idempotency, data: "--data include_db=true --data include_idempotency=true", extras: "--extra db" }
          # Webhooks implies jobs (worker) + tenancy (its users + db). This row exercises the
          # /orgs/{org_id}/webhooks CRUD, the best-effort dispatch enqueue (fake pool — no Redis),
          # and the signed deliver_webhook task. No audit here, so delivery records nothing.
          - { capability: webhooks, data: "--data include_webhooks=true", extras: "--extra db --extra users --extra worker" }
          # Both together, plus rbac: the audit list endpoint is org-scoped + admin-gated, the
          # org.created / member.added flows record audit entries, member.added fans out a webhook,
          # and each delivery attempt is recorded to the audit log — the full cross-module path.
          - { capability: audit_webhooks, data: "--data include_audit=true --data include_webhooks=true --data include_rbac=true", extras: "--extra db --extra users --extra worker" }
          # Metering is org-scoped (implies tenancy). The ALONE row runs metering+tenancy with the
          # default (free) rate card — ingest→aggregate→invoice→wallet-charge + the rating engine.
          # The _full row adds billing so the plan (and thus the rate card) comes from the org's
          # Subscription, exercising the metering↔billing seam.
          - { capability: metering,      data: "--data include_metering=true --data include_tenancy=true", extras: "--extra db --extra users" }
          - { capability: metering_full, data: "--data include_metering=true --data include_billing=true --data include_audit=true --data include_rbac=true", extras: "--extra db --extra users --extra payments" }
          # Rate limiting is db-independent (Redis only). The ALONE row runs it at minimal deps with
          # NO db and NO Redis reachable — which is the point: the DoD requires the whole subsystem
          # to degrade OPEN, so this leg proves a service with a dead/absent limiter still serves.
          # The _full row adds billing (and its tenancy/users), so the plan->tier lookup, the
          # in-process plan cache and the login-throttle + failed-login-lockout wiring all compile
          # and are exercised against the seam.
          - { capability: ratelimit,      data: "--data include_ratelimit=true --data include_db=false --data include_cache=true", extras: "--extra cache" }
          - { capability: ratelimit_full, data: "--data include_ratelimit=true --data include_billing=true", extras: "--extra db --extra users --extra payments --extra cache" }
          # Observability is capability-independent. The base row runs it ALONE at minimal deps
          # (no db/users/jobs) so any dependency leak surfaces (the OTel SDK + Prometheus + Sentry
          # install and import, /healthz + /readyz + /metrics serve, setup no-ops with no OTLP
          # endpoint). The _full row adds db + users + jobs so the SQLAlchemy + Redis
          # auto-instrumentation and the db/redis readiness probes are compiled and exercised.
          - { capability: observability,      data: "--data include_observability=true --data include_db=false --data include_cache=false", extras: "--extra observability" }
          - { capability: observability_full, data: "--data include_observability=true --data include_db=true --data include_users=true --data include_jobs=true", extras: "--extra db --extra users --extra worker --extra observability" }
          # Admin implies db + users (it needs models to administer + an identity to gate on). The
          # base row runs it MINIMAL (admin alone fans out to db + users) so a dependency leak
          # surfaces and the superuser-only auth + UserAdmin redaction are exercised. The _full row
          # adds every administerable capability so each ModelView (orgs, memberships, subscriptions,
          # api keys, webhook endpoints, read-only audit) is registered and its secret-redaction path
          # compiled — the alembic round-trip below covers the full migration chain.
          - { capability: admin,      data: "--data include_admin=true", extras: "--extra db --extra users --extra admin" }
          - { capability: admin_full, data: "--data include_admin=true --data include_tenancy=true --data include_billing=true --data include_api_keys=true --data include_webhooks=true --data include_audit=true", extras: "--extra db --extra users --extra worker --extra payments --extra admin" }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0   # copier reads git history/refs

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.11.x"

      - name: Generate a ${{ matrix.capability }} project from the current commit
        run: |
          uvx copier copy --defaults --trust --vcs-ref HEAD \
            --data agent_framework=none \
            ${{ matrix.data }} \
            . /tmp/generated

      - name: Lock, sync, lint, test + alembic round-trip
        # Delegates to scripts/leg-check.sh — the SINGLE definition of "a leg passed", invoked
        # identically here and during local validation. Two separate lists of commands drift, and
        # the drift only surfaces as "it passed locally but CI disagrees".
        run: bash scripts/leg-check.sh /tmp/generated ${{ matrix.extras }}

  # Single STABLE required status check that gates auto-merge on the whole capability
  # matrix. It aggregates the matrix via `needs`, so adding a capability row above is
  # covered automatically and branch protection never has to change.
  generate-capability-gate:
    name: "generate (capability)"
    needs: [generate-capability]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every capability leg to have passed
        run: |
          result="${{ needs.generate-capability.result }}"
          echo "capability matrix result: $result"
          if [ "$result" != "success" ]; then
            echo "::error::one or more capability legs failed — blocking the gate"
            exit 1
          fi
          echo "all capability legs passed"

  # THE single stable required check for this whole workflow. Branch protection / the `main`
  # ruleset requires only "ci-ok", so adding, renaming or splitting a job above never means
  # touching repo settings again — and Renovate's platformAutomerge finally has one
  # deterministic context to wait on instead of five names that drift with the matrix.
  #
  # `if: always()` + the explicit result check is deliberate, not ceremony. Without it, a
  # failed dependency SKIPS this job, and GitHub treats a skipped required check as PASSING
  # — auto-merge would sail straight through a red matrix. Same defensive shape as
  # generate-capability-gate above.
  #
  # Deliberately NOT in `needs`:
  #   - release      — push-to-main-only, so it is skipped on every PR (a skip would fail
  #                    the check below and block every PR).
  #   - supply-chain — report-only by design (see its job comment): a volatile external CVE
  #                    feed must never hard-block the autonomous merge.
  ci-ok:
    name: ci-ok
    needs: [generate-and-test, generate-capability, generate-capability-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every gating job to have succeeded
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ' ') }}"
          echo "gating job results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "::error::a gating job reported '$result' — ci-ok fails"
              exit 1
            fi
          done
          echo ok

  # Supply-chain proof (ROADMAP P2c): build a real rendered image (nothing else in CI builds
  # the Dockerfile, so this catches Dockerfile regressions), emit a CycloneDX SBOM, and scan it.
  # Not a required check — the Trivy scan is report-only so a volatile external CVE feed can't
  # hard-block the autonomous merge (Renovate auto-remediates vulnerable deps); the signed,
  # published image + enforced gate ship in the GENERATED service's CI (P2c-3).
  supply-chain:
    name: "supply-chain (build · SBOM · scan)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0   # copier reads git history/refs

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.11.x"

      - name: Generate a representative project
        run: |
          uvx copier copy --defaults --trust --vcs-ref HEAD \
            --data agent_framework=none --data include_api_keys=true \
            . /tmp/generated

      - name: Lock + CycloneDX SBOM (uv export)
        working-directory: /tmp/generated
        run: |
          set -euo pipefail
          uv lock
          uv export --format cyclonedx1.5 -o sbom.cdx.json
          python3 - <<'PY'
          import json
          sbom = json.load(open("sbom.cdx.json"))
          assert sbom.get("bomFormat") == "CycloneDX", sbom.get("bomFormat")
          print(f"SBOM OK: CycloneDX {sbom['specVersion']}, {len(sbom.get('components', []))} components")
          PY

      - name: Build the digest-pinned, reproducible image
        working-directory: /tmp/generated
        run: |
          set -euo pipefail
          git init -q && git add -A
          git -c user.email=ci@local -c user.name=ci commit -qm "ci: generated"
          # SOURCE_DATE_EPOCH (commit time) -> BuildKit rewrites layer timestamps (reproducible build).
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          docker buildx build --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            -t generated-service:ci --load .

      - name: Scan the image (Trivy — surface fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: generated-service:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # exit-code 0 = report-only (see the job comment); promote to "1" + a required check
          # once a CVE triage/waiver process exists.
          exit-code: "0"

      - name: Upload the SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: /tmp/generated/sbom.cdx.json
          if-no-files-found: error

  release:
    name: Tag + release
    needs: [generate-and-test, generate-capability]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Compute next version from Conventional Commits
        id: tag
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # only cut a release when a feat:/fix:/BREAKING commit exists since the
          # last tag; chore:/ci:/docs: pushes mint nothing (no version inflation).
          default_bump: false

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          generate_release_notes: true
          body: ${{ steps.tag.outputs.changelog }}
