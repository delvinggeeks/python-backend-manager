name: Update dependencies

# The uv-native "stay updated" job: every Monday it bumps the lockfile to the
# latest compatible versions, runs the test suite, and opens ONE pull request.
# It never pushes to main directly — CI + your review are the safety gate.
on:
  schedule:
    - cron: "0 6 * * 1"   # 06:00 UTC every Monday
  workflow_dispatch: {}    # allow manual runs

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Upgrade lockfile to latest compatible versions
        run: uv lock --upgrade

      - name: Sync upgraded environment
        run: uv sync --frozen

      - name: Run gates against the upgrade
        run: |
          uv run ruff check .
          uv run pytest

      - name: Open pull request with the upgrade
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "chore(deps): weekly uv lock --upgrade"
          branch: chore/deps-upgrade
          delete-branch: true
          title: "chore(deps): weekly dependency upgrade"
          body: |
            Automated `uv lock --upgrade`. CI gates ran green on this branch.

            Review the `uv.lock` diff — pay attention to the agent-framework and
            `pydantic`/`openai` lines, which move fast and occasionally break.
          labels: dependencies
