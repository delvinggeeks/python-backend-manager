# Copier template configuration.
# Generate:  uvx copier copy gh:witaura/witaura-backend-template ./myservice
# Update:    cd myservice && uvx copier update   (pulls latest template version)

_min_copier_version: "9.0.0"
_subdirectory: template
_envops:
  trim_blocks: true
  lstrip_blocks: true

# Keep the answers file out of templating conflicts and always refresh it.
_answers_file: .copier-answers.yml

_message_after_copy: |
  Project "{{ project_name }}" created.

  Next steps:
    cd {{ _copier_conf.dst_path }}
    git init && git add -A && git commit -m "chore: scaffold from witaura-backend-template"
    uv lock && uv sync{% for e in sync_extras.split() %} --extra {{ e }}{% endfor %}
    uv run pre-commit install
    just run

  Later, to pull template improvements:  uvx copier update

_message_after_update: |
  Template update applied to "{{ project_name }}".
  Review the diff, then: uv lock && uv sync && just check

# ---------------------------------------------------------------------------
# Questions
# ---------------------------------------------------------------------------
project_name:
  type: str
  help: Human-readable project name
  default: WitAura Service

project_slug:
  type: str
  help: Distribution / package name (kebab-case)
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9-]+$')) %}
    Must be lowercase, start with a letter, and contain only letters, digits and hyphens.
    {% endif %}

description:
  type: str
  help: One-line service description
  default: A WitAura Python backend service

author_name:
  type: str
  default: WitAura

author_email:
  type: str
  default: admin@witaura.in

python_version:
  type: str
  help: Python version to target
  default: "3.13"
  choices:
    - "3.13"
    - "3.14"

agent_framework:
  type: str
  help: AI agent framework for this service (pick one; they cannot coexist)
  default: pydantic-ai
  choices:
    "None — raw provider clients only": none
    "PydanticAI": pydantic-ai
    "LangGraph": langgraph
    "OpenAI Agents SDK": openai-agents

include_db:
  type: bool
  help: Include Postgres + pgvector + async SQLAlchemy + Alembic?
  default: true

include_cache:
  type: bool
  help: Include Redis?
  default: true

include_worker:
  type: bool
  help: Include arq background worker?
  default: false

include_auth:
  type: bool
  help: Include JWT / argon2 / Authlib auth deps?
  default: false

include_observability:
  type: bool
  help: >-
    Scaffold full OpenTelemetry observability (the three pillars, correlated): an
    `app/observability` package that auto-instruments FastAPI + httpx (+ SQLAlchemy when db,
    + redis/arq when jobs) and exports traces, metrics and logs over OTLP; trace_id/span_id
    injected into the existing structlog output; a Prometheus `/metrics` endpoint plus
    `/healthz` (liveness) and `/readyz` (readiness — probes db/redis when present); unhandled
    errors recorded on spans with an OPTIONAL Sentry integration. Nothing exports until
    OTEL_EXPORTER_OTLP_ENDPOINT is set and Sentry no-ops without SENTRY_DSN, so a fresh service
    runs clean with no collector. Ships a `--profile observability` local stack (OTel Collector
    + Prometheus + Tempo + Loki + Grafana) via `just observe`. Implies the `observability` extra.
  default: false

include_mcp:
  type: bool
  help: Mount a FastMCP server at /mcp (expose curated tools over MCP)?
  default: false

include_users:
  type: bool
  help: >-
    Scaffold a first-class users/auth capability (fastapi-users: UUID user model,
    JWT bearer login, register / reset / verify / users routers)? Implies the db +
    users extras.
  default: false

include_tenancy:
  type: bool
  help: >-
    Scaffold multi-tenancy (organizations + memberships): an `/orgs` router, the
    Organization + Membership models with a per-membership role, and a migration.
    Implies the users capability (and therefore the db + users extras).
  default: false

include_rls:
  type: bool
  help: >-
    Add Postgres Row-Level Security as a second tenant-isolation layer (a backstop to the
    app-level org scoping): a per-request `app.current_tenant` GUC set from the URL, plus
    `CREATE POLICY` + `FORCE ROW LEVEL SECURITY` on the tenant data tables, so a query that
    forgets its `WHERE organization_id` still can't read another tenant's rows. Postgres-only
    (a no-op on SQLite); needs session-mode connection pooling (see the PgBouncer note in
    `app/tenancy/rls.py`). Implies the tenancy capability.
  default: "{{ include_tenancy }}"
  when: "{{ include_tenancy }}"

include_rbac:
  type: bool
  help: >-
    Scaffold RBAC / permissions over memberships: an `app/rbac` package with a role
    hierarchy (owner > admin > member, extensible), `require_role(...)` /
    `require_scope(...)` FastAPI dependencies, and a permission-check helper applied
    to the `/orgs` member routes. Implies the tenancy capability (and its users + db).
  default: false

include_api_keys:
  type: bool
  help: >-
    Scaffold hashed API keys / service tokens (org-scoped): an `ApiKey` model (plaintext
    prefix for lookup + a SHA-256 hash of the secret), `/orgs/{org_id}/api-keys`
    create / list / revoke routers, an auth dependency accepting EITHER a JWT OR an API
    key, and a migration. Implies the tenancy capability (and therefore its users + db).
  default: false

include_billing:
  type: bool
  help: >-
    Scaffold billing & entitlements (provider-agnostic): a hexagonal PaymentsPort with
    swappable Stripe + Razorpay adapters (pick the active one below), a provider customer
    per organization, `/orgs/{org_id}/billing` checkout-session + customer-portal routers,
    a signature-verified webhook with idempotent (deduped) event handling, a Subscription
    model synced from normalized events, an entitlements map with a `require_feature(...)`
    dependency applied to an example route, and a migration. Implies the tenancy capability
    (and therefore its users + db) plus the `payments` extra (both provider SDKs).
  default: false

payments_provider:
  type: str
  help: >-
    Active payments provider for this service. Both adapters ship; this picks the default
    one (override at runtime with PAYMENTS_PROVIDER). Razorpay is the India-first choice.
  choices:
    - stripe
    - razorpay
  default: stripe
  when: "{{ include_billing }}"

include_storage:
  type: bool
  help: >-
    Scaffold S3-compatible object storage (aioboto3): an `app/storage` package with a
    settings-driven async S3 client (works with AWS or any S3-compatible endpoint —
    MinIO, R2, ...), upload / download / delete / presigned-URL helpers, and a `/storage`
    router. Keys are tenant-prefixed under `/orgs/{org_id}/storage` when tenancy is on,
    plain otherwise. Implies the `storage` extra (aioboto3); no database required.
  default: false

include_email:
  type: bool
  help: >-
    Scaffold provider-agnostic email / notifications: an `app/email` package with a hexagonal
    EmailPort, swappable SMTP (aiosmtplib) + Amazon SES (aioboto3) adapters (pick the active one
    below), a console/suppress dev backend so nothing sends unconfigured, jinja2 body templates,
    and a typed send helper. Welcome + password-reset emails wire into the users flow when the
    users capability is on. Implies the `email` extra (both adapters' SDKs + jinja2); no database
    required.
  default: false

email_provider:
  type: str
  help: >-
    Active email provider for this service. Both adapters ship; this picks the default one
    (override at runtime with EMAIL_PROVIDER, or set EMAIL_SUPPRESS_SEND=true in dev). SMTP suits
    Zoho / Microsoft 365; SES pairs with S3-compatible storage.
  choices:
    - smtp
    - ses
  default: smtp
  when: "{{ include_email }}"

include_jobs:
  type: bool
  help: >-
    Scaffold background jobs + a scheduler (arq): an `app/jobs` package with a Redis-backed arq
    worker (run with `just worker`), a thin `enqueue(...)` seam so routes/services queue work
    without importing arq, an example task, and an example recurring job via arq's built-in cron.
    arq is used directly (no runtime port — it's an infra choice, not a swappable vendor). When
    the email capability is also on, the user-manager welcome / password-reset emails are sent
    THROUGH the queue instead of inline. Implies the `worker` extra (arq); no database required.
  default: false

include_audit:
  type: bool
  help: >-
    Scaffold an append-only audit log: an `app/audit` package with an `AuditLog` model
    (actor / action / target / JSON metadata, org-scoped when tenancy is on), a `record(...)`
    helper any service can call, a read-only paginated list endpoint (admin-gated when RBAC is
    on), and a migration. Real events (org created, member added) are recorded when those flows
    are present. Append-only: no update or delete. Implies the db extra; no users required.
  default: false

include_webhooks:
  type: bool
  help: >-
    Scaffold outbound webhooks: an `app/webhooks` package with a tenant-scoped `WebhookEndpoint`
    model (url / per-endpoint secret / subscribed events / active), `/orgs/{org_id}/webhooks`
    CRUD routers (admin-gated when RBAC is on), and a `dispatch(...)` helper that ENQUEUES one
    delivery per subscribed endpoint. Delivery runs in the arq worker (never inline): it POSTs the
    event signed with HMAC-SHA256 (`X-Webhook-Signature`) via httpx and retries with backoff.
    Implies the jobs capability (worker extra) plus the tenancy capability (its users + db).
  default: false

include_idempotency:
  type: bool
  help: >-
    Add Stripe-style idempotency keys for mutating requests: a pure-ASGI middleware that, when a
    client sends an `Idempotency-Key` header on a POST/PUT/PATCH/DELETE, atomically claims the key
    in a Postgres `idempotency_keys` store (the UNIQUE constraint IS the lock), runs the handler
    once, caches the response, and replays that exact response on any retry — so a network retry
    can't double-charge or double-submit. Concurrent duplicates get 409; a key reused with a
    different request body gets 422; keys expire (TTL) and are reclaimed. Swappable behind an
    `IdempotencyPort` (a Redis adapter is possible later). Implies the db extra; no-ops for any
    request without the header, so it's safe to leave on. On by default for database services.
  default: "{{ include_db }}"
  when: "{{ include_db }}"

include_metering:
  type: bool
  help: >-
    Scaffold usage metering + rating + prepaid billing (the AI-usage-priced surface): an
    `app/metering` package with org-scoped `/orgs/{org_id}/usage` (idempotent ingest + per-meter
    totals), `/orgs/{org_id}/wallet` (prepaid credits, atomic debit) and `/orgs/{org_id}/invoices`
    (close a period → rate the usage against the plan's rate card [base + included quota + overage]
    → charge the wallet) routers, the `MeteringPort` + `BillingPort` seams with a Postgres-native
    default adapter (managed Lago/OpenMeter/Stripe-Meters behind the same port), a pure rating
    engine, and a migration. The plan that selects the rate card comes from the billing
    `Subscription` when billing is on, else the default (free) card. **Requires (implies) the
    tenancy capability** (it is org-scoped); pairs with billing. Implies the db extra.
  default: false
  validator: >-
    {% if include_metering and not (include_tenancy or include_rbac or include_api_keys or include_billing or include_webhooks) %}
    include_metering is org-scoped and needs the tenancy capability. Also enable one of:
    include_tenancy / include_rbac / include_api_keys / include_billing / include_webhooks.
    {% endif %}

include_admin:
  type: bool
  help: >-
    Scaffold a sqladmin control panel at `/admin`, gated behind SUPERUSER-only authentication
    (an `AuthenticationBackend` wired to the user table + fastapi-users password hashing — the
    panel is never mounted open). Registers read/write model views for the capabilities actually
    present (users always; organizations + memberships with tenancy; subscriptions with billing;
    API keys with api_keys; webhook endpoints with webhooks; the audit log read-only with audit),
    redacting secrets (password / API-key hashes, webhook secrets, provider customer / subscription
    ids) from the list, detail and edit forms. Implies the db + users capabilities (it needs models
    to administer and an identity to gate on) plus the `admin` extra (sqladmin).
  default: false

saas_extras:
  type: str
  help: >-
    SaaS + agentic capability extras to install (toggle with space, confirm with enter).
    Renovate / uv lock keep the selected ones latest-and-Python-compatible.
  multiselect: true
  default: []
  choices:
    - payments
    - email
    - storage
    - admin
    - ratelimit
    - scheduler
    - api
    - rag

automerge_safe_updates:
  type: bool
  help: Let Renovate auto-merge patch & dev-dep updates after CI passes?
  default: true

# ---------------------------------------------------------------------------
# Computed (hidden) — the extras this service installs by default.
# ---------------------------------------------------------------------------
sync_extras:
  type: str
  when: false
  default: >-
    {% set parts = [] %}
    {% if include_db %}{% set _ = parts.append('db') %}{% endif %}
    {% if include_cache %}{% set _ = parts.append('cache') %}{% endif %}
    {% if include_worker %}{% set _ = parts.append('worker') %}{% endif %}
    {% if include_auth %}{% set _ = parts.append('auth') %}{% endif %}
    {% if include_observability %}{% set _ = parts.append('observability') %}{% endif %}
    {% if include_mcp %}{% set _ = parts.append('mcp') %}{% endif %}
    {% if include_users or include_tenancy or include_rbac or include_api_keys or include_billing or include_webhooks or include_admin or include_metering %}{% if 'db' not in parts %}{% set _ = parts.append('db') %}{% endif %}{% if 'users' not in parts %}{% set _ = parts.append('users') %}{% endif %}{% endif %}
    {% if include_audit %}{% if 'db' not in parts %}{% set _ = parts.append('db') %}{% endif %}{% endif %}
    {% if include_admin %}{% if 'admin' not in parts %}{% set _ = parts.append('admin') %}{% endif %}{% endif %}
    {% if include_billing %}{% if 'payments' not in parts %}{% set _ = parts.append('payments') %}{% endif %}{% endif %}
    {% if include_storage %}{% if 'storage' not in parts %}{% set _ = parts.append('storage') %}{% endif %}{% endif %}
    {% if include_email %}{% if 'email' not in parts %}{% set _ = parts.append('email') %}{% endif %}{% endif %}
    {% if include_jobs or include_webhooks %}{% if 'worker' not in parts %}{% set _ = parts.append('worker') %}{% endif %}{% endif %}
    {% for e in saas_extras %}{% if e not in parts %}{% set _ = parts.append(e) %}{% endif %}{% endfor %}
    {% if agent_framework != 'none' %}{% set _ = parts.append('llm') %}{% set _ = parts.append(agent_framework) %}{% endif %}
    {{ parts | join(' ') }}
