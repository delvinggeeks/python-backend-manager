# Copier template configuration.
# Generate:  uvx copier copy gh:witaura/witaura-backend-template ./myservice
# Update:    cd myservice && uvx copier update   (pulls latest template version)

_min_copier_version: "9.0.0"
_subdirectory: template
_envops:
  trim_blocks: true
  lstrip_blocks: true

# Keep the answers file out of templating conflicts and always refresh it.
_answers_file: .copier-answers.yml

_message_after_copy: |
  Project "{{ project_name }}" created.

  Next steps:
    cd {{ _copier_conf.dst_path }}
    git init && git add -A && git commit -m "chore: scaffold from witaura-backend-template"
    uv lock && uv sync{% for e in sync_extras.split() %} --extra {{ e }}{% endfor %}
    uv run pre-commit install
    just run

  Later, to pull template improvements:  uvx copier update

_message_after_update: |
  Template update applied to "{{ project_name }}".
  Review the diff, then: uv lock && uv sync && just check

# ---------------------------------------------------------------------------
# Questions
# ---------------------------------------------------------------------------
project_name:
  type: str
  help: Human-readable project name
  default: WitAura Service

project_slug:
  type: str
  help: Distribution / package name (kebab-case)
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9-]+$')) %}
    Must be lowercase, start with a letter, and contain only letters, digits and hyphens.
    {% endif %}

description:
  type: str
  help: One-line service description
  default: A WitAura Python backend service

author_name:
  type: str
  default: WitAura

author_email:
  type: str
  default: admin@witaura.in

python_version:
  type: str
  help: Python version to target
  default: "3.13"
  choices:
    - "3.13"
    - "3.14"

agent_framework:
  type: str
  help: AI agent framework for this service (pick one; they cannot coexist)
  default: pydantic-ai
  choices:
    "None — raw provider clients only": none
    "PydanticAI": pydantic-ai
    "LangGraph": langgraph
    "OpenAI Agents SDK": openai-agents

include_db:
  type: bool
  help: Include Postgres + pgvector + async SQLAlchemy + Alembic?
  default: true

include_cache:
  type: bool
  help: Include Redis?
  default: true

include_worker:
  type: bool
  help: Include arq background worker?
  default: false

include_auth:
  type: bool
  help: Include JWT / argon2 / Authlib auth deps?
  default: false

include_observability:
  type: bool
  help: Include Sentry + Logfire + OpenTelemetry?
  default: false

include_mcp:
  type: bool
  help: Mount a FastMCP server at /mcp (expose curated tools over MCP)?
  default: false

include_users:
  type: bool
  help: >-
    Scaffold a first-class users/auth capability (fastapi-users: UUID user model,
    JWT bearer login, register / reset / verify / users routers)? Implies the db +
    users extras.
  default: false

include_tenancy:
  type: bool
  help: >-
    Scaffold multi-tenancy (organizations + memberships): an `/orgs` router, the
    Organization + Membership models with a per-membership role, and a migration.
    Implies the users capability (and therefore the db + users extras).
  default: false

include_rbac:
  type: bool
  help: >-
    Scaffold RBAC / permissions over memberships: an `app/rbac` package with a role
    hierarchy (owner > admin > member, extensible), `require_role(...)` /
    `require_scope(...)` FastAPI dependencies, and a permission-check helper applied
    to the `/orgs` member routes. Implies the tenancy capability (and its users + db).
  default: false

include_api_keys:
  type: bool
  help: >-
    Scaffold hashed API keys / service tokens (org-scoped): an `ApiKey` model (plaintext
    prefix for lookup + a SHA-256 hash of the secret), `/orgs/{org_id}/api-keys`
    create / list / revoke routers, an auth dependency accepting EITHER a JWT OR an API
    key, and a migration. Implies the tenancy capability (and therefore its users + db).
  default: false

include_billing:
  type: bool
  help: >-
    Scaffold billing & entitlements (Stripe): a Stripe customer per organization,
    `/orgs/{org_id}/billing` create-checkout-session + customer-portal routers, a
    signature-verified webhook with idempotent (deduped) event handling, a Subscription
    model synced from webhook events, an entitlements map with a `require_feature(...)`
    dependency applied to an example route, and a migration. Implies the tenancy
    capability (and therefore its users + db) plus the `payments` (stripe) extra.
  default: false

include_storage:
  type: bool
  help: >-
    Scaffold S3-compatible object storage (aioboto3): an `app/storage` package with a
    settings-driven async S3 client (works with AWS or any S3-compatible endpoint —
    MinIO, R2, ...), upload / download / delete / presigned-URL helpers, and a `/storage`
    router. Keys are tenant-prefixed under `/orgs/{org_id}/storage` when tenancy is on,
    plain otherwise. Implies the `storage` extra (aioboto3); no database required.
  default: false

saas_extras:
  type: str
  help: >-
    SaaS + agentic capability extras to install (toggle with space, confirm with enter).
    Renovate / uv lock keep the selected ones latest-and-Python-compatible.
  multiselect: true
  default: []
  choices:
    - payments
    - email
    - storage
    - admin
    - ratelimit
    - scheduler
    - api
    - rag

automerge_safe_updates:
  type: bool
  help: Let Renovate auto-merge patch & dev-dep updates after CI passes?
  default: true

# ---------------------------------------------------------------------------
# Computed (hidden) — the extras this service installs by default.
# ---------------------------------------------------------------------------
sync_extras:
  type: str
  when: false
  default: >-
    {% set parts = [] %}
    {% if include_db %}{% set _ = parts.append('db') %}{% endif %}
    {% if include_cache %}{% set _ = parts.append('cache') %}{% endif %}
    {% if include_worker %}{% set _ = parts.append('worker') %}{% endif %}
    {% if include_auth %}{% set _ = parts.append('auth') %}{% endif %}
    {% if include_observability %}{% set _ = parts.append('observability') %}{% endif %}
    {% if include_mcp %}{% set _ = parts.append('mcp') %}{% endif %}
    {% if include_users or include_tenancy or include_rbac or include_api_keys or include_billing %}{% if 'db' not in parts %}{% set _ = parts.append('db') %}{% endif %}{% if 'users' not in parts %}{% set _ = parts.append('users') %}{% endif %}{% endif %}
    {% if include_billing %}{% if 'payments' not in parts %}{% set _ = parts.append('payments') %}{% endif %}{% endif %}
    {% if include_storage %}{% if 'storage' not in parts %}{% set _ = parts.append('storage') %}{% endif %}{% endif %}
    {% for e in saas_extras %}{% if e not in parts %}{% set _ = parts.append(e) %}{% endif %}{% endfor %}
    {% if agent_framework != 'none' %}{% set _ = parts.append('llm') %}{% set _ = parts.append(agent_framework) %}{% endif %}
    {{ parts | join(' ') }}
