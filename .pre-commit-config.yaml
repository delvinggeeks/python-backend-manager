# Pre-commit hooks for the TEMPLATE REPOSITORY itself.
# (The hooks that ship INTO generated services live in template/.pre-commit-config.yaml.)
repos:
  - repo: local
    hooks:
      # A construct can be valid when a {% if %} block renders and malformed when it does not, so
      # the template looks fine and only one capability combination breaks. This renders each
      # staged *.py.jinja with every gate OFF and checks the result.
      #
      # FAST-FEEDBACK SHORTCUT, not a complete gate: it covers exactly one combination. The
      # generate-matrix in CI remains the complete gate for this class — see scripts/leg-check.sh.
      - id: micro-render-check
        name: micro-render (gated blocks off) must stay format-clean
        # No `--with ruff`: an unpinned extra resolved whatever ruff released last, so this gate
        # could disagree with both CI and the format hook. The script resolves the one recorded
        # version from `.ruff-version` itself.
        entry: uv run --no-project --with jinja2 python scripts/micro-render-check.py
        language: system
        files: \.py\.jinja$
        pass_filenames: true
