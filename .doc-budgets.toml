# Line budgets for the ALWAYS-READ document set.
#
# Every session reads these files in full, so their length is a tax on every session's context.
# Budgeting them makes growth a decision instead of a drift: exceeding a budget fails CI, and the
# only way past it is to raise the number in the same PR — which is the review moment, exactly as
# adding a line to PUBLIC_ROUTES is.
#
# JIT documents (ROADMAP.md, SECURITY-BASELINE.md, the rest of docs/) are deliberately UNBUDGETED.
# They are read on demand by the sessions that need them, so their length costs nothing by default,
# and a ledger must be free to hold the work that actually exists.
[budgets]
# Raised 90 -> 92 by HANDOFF-1. The session protocol gained the `/handoff` bookend; AGENTS.md was
# already at 90/90, the slice-scope note having taken the last of the headroom. Raising is the
# sanctioned path (see above) and is preferred here to manufacturing room by cutting prose that is
# still true — the cut would be the unreviewed change, not the raise.
"AGENTS.md" = 92
"docs/PLATFORM-INTEGRATION.md" = 120
